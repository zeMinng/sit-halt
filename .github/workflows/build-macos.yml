name: Build macOS

on:
  # 打 tag（v0.1.0 等）时自动打包并上传 Release
  push:
    tags:
      - 'v*'
  # 也支持在 Actions 页面手动触发（仅出构建产物，不发 Release）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64-apple-darwin   # Apple Silicon（M 系列）
            runner: macos-latest
          - arch: x86_64-apple-darwin    # Intel 芯片
            runner: macos-13
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (.app + .dmg)
        run: pnpm tauri build --target ${{ matrix.arch }} --bundles app,dmg
        env:
          # 当前为未签名构建；后续接入 Apple 签名 / 公证时，
          # 在此补充 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 等密钥变量
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SitHalt-macOS-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.arch }}/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Attach assets to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.arch }}/release/bundle/dmg/*.dmg

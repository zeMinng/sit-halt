name: Build Windows

on:
  # 打 tag（v0.1.0 等）时自动打包并上传 Release
  push:
    tags:
      - 'v*'
  # 也支持在 Actions 页面手动触发（仅出构建产物，不发 Release）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-pc-windows-msvc   # 64 位 Windows（主流）
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (.msi + .exe)
        run: pnpm tauri build --target ${{ matrix.arch }} --bundles msi,nsis
        env:
          # 当前为未签名构建；后续接入 Windows 代码签名（EV/OV 证书）时，
          # 在此补充 CSC_LINK / CSC_KEY_PASSWORD 等密钥变量
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SitHalt-Windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.arch }}/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Attach assets to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.arch }}/release/bundle/nsis/*.exe
